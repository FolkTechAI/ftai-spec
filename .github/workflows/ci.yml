name: FTAI Linter CI

on:
  push:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'
  pull_request:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'

jobs:
  lint-ftai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run linter on passing vectors
        run: |
          python3 parsers/python/ftai_linter.py tests/vectors/pass/

      - name: Check failure vectors
        run: |
          python3 parsers/python/ftai_linter.py tests/vectors/fail/ || echo "Failures detected as expected"
