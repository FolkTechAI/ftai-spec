name: FTAI Linter CI

on:
  push:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'
  pull_request:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'

jobs:
  lint-ftai:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dummy dependencies
      run: |
        echo "Skipping install for now..."

    - name: Run linter on passing vectors
      run: |
        echo "Pretending to lint pass/ vectors..."  
        ls tests/vectors/pass/

    - name: Ensure failure vectors are invalid
      run: |
        echo "Pretending to check fail/ vectors..."
        ls tests/vectors/fail/
