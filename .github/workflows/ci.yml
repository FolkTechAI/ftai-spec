name: FTAI Linter CI

on:
  push:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'
  pull_request:
    paths:
      - 'tests/vectors/pass/**'
      - 'tests/vectors/fail/**'

jobs:
  lint-ftai:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install -r requirements.txt

    - name: Run linter on passing vectors
      run: |
        for file in tests/vectors/pass/*.ftai; do
          echo "Linting $file..."
          python3 parsers/ftai_linter.py "$file"
        done

    - name: Ensure failure vectors trigger errors
      run: |
        set +e
        for file in tests/vectors/fail/*.ftai; do
          echo "Checking that $file fails..."
          python3 parsers/ftai_linter.py "$file"
          if [ $? -eq 0 ]; then
            echo "❌ ERROR: $file should have failed but passed!"
            exit 1
          else
            echo "✅ Correctly failed $file"
          fi
        done
        set -e
