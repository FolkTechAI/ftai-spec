name: FTAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        mode: ["--strict", "--lenient"]
        color: ["--color", "--no-color"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install . pytest pytest-cov

    - name: Lint passing file
      run: |
        ftai lint tests/vectors/pass/pass_minimal.ftai ${{ matrix.mode }} ${{ matrix.color }}

    - name: Lint failing file
      run: |
        ftai lint tests/vectors/fail/fail_quoted_tag_overflow.ftai ${{ matrix.mode }} ${{ matrix.color }}
      continue-on-error: false

    - name: Run Pytest with Coverage
      run: |
        pytest --cov=src/ftai_linter --cov-report=xml tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true

    - name: Confirm Success
      if: success()
      run: echo "✅ All tests and uploads completed."
