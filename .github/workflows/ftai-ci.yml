name: FTAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        mode: ["--strict", "--lenient"]
        color: ["--color", "--no-color"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run linter on pass vectors
      run: |
        ftai lint tests/vectors/pass/pass_minimal.ftai ${{ matrix.mode }} ${{ matrix.color }}

    - name: Run linter on fail vectors
      run: |
        ftai lint tests/vectors/fail/fail_quoted_tag_overflow.ftai ${{ matrix.mode }} ${{ matrix.color }}
      continue-on-error: false

    - name: Run pytest with coverage
      run: |
        pytest --cov=src/ftai_linter --cov-report=xml tests/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
